[project]
name = "savemycontext"
version = "0.3.0"
description = "Self-hosted FastAPI backend and Linux/macOS service CLI for SaveMyContext"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "SaveMyContext" }]
keywords = ["ai", "chrome-extension", "fastapi", "knowledge-base", "obsidian", "self-hosted"]
classifiers = [
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Utilities",
]
dependencies = [
  "aiosqlite>=0.21.0",
  "asyncpg>=0.31.0",
  "fastapi>=0.139.0",
  "greenlet>=3.2.4",
  "httpx>=0.28.1",
  "mcp==2.2.0",
  "orjson>=3.10.0",
  "python-dotenv>=1.1.1",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.44",
  "uvicorn[standard]>=0.35.0",
  "uvloop>=0.22.1; platform_system != 'Windows'",
]

[project.scripts]
dev = "app.dev:main"
smc = "app.cli:main"
savemycontext = "app.cli:main"
smc-workspace = "app.workspace.client:main"

[project.urls]
Documentation = "https://nociza.github.io/SaveMyContext/"
Issues = "https://github.com/nociza/SaveMyContext/issues"
Source = "https://github.com/nociza/SaveMyContext"

[dependency-groups]
dev = [
  "pip-audit>=2.10.1",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.workspace" = ["web/*.html", "web/*.js", "web/*.css", "web/*.json", "web/BUILD.txt"]

[tool.uv]
package = true
