version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/extension"
    schedule:
      interval: weekly
    groups:
      extension-dependencies:
        patterns:
          - "*"
