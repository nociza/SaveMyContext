name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Standalone frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test independent build and configuration
        run: npm test
      - name: Build static application
        run: npm run build
      - name: Verify Python-vendored UI matches canonical source
        run: npm run check:backend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Audit Python dependencies
        run: uv run --frozen pip-audit
      - name: Lint backend
        run: uv run --frozen ruff check app tests scripts
      - name: Run backend tests
        run: uv run --frozen python -m pytest -q
      - name: Build distribution
        run: uv build --no-sources
      - name: Smoke-test installed wheel
        run: >-
          uv run --isolated --no-project --with ./dist/savemycontext-0.3.0-py3-none-any.whl python -c
          "from app.core.version import get_app_version; from app.main import app;
          from fastapi.testclient import TestClient;
          assert app.title == 'SaveMyContext API'; client = TestClient(app);
          assert client.get('/workspace').status_code == 200;
          assert client.get('/workspace-assets/config.json').json()['apiBase'] == '/api/v1/workspace';
          assert client.get('/workspace-assets/embed.js').status_code == 200;
          print(get_app_version())"

  postgres-smoke:
    name: PostgreSQL schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: savemycontext
          POSTGRES_USER: savemycontext
          POSTGRES_PASSWORD: savemycontext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savemycontext -d savemycontext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SAVEMYCONTEXT_DATABASE_URL: postgresql+asyncpg://savemycontext:savemycontext@127.0.0.1:5432/savemycontext
      SAVEMYCONTEXT_GIT_VERSIONING_ENABLED: "false"
      SAVEMYCONTEXT_WORKSPACE_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Initialize and probe PostgreSQL twice
        run: uv run --frozen python scripts/postgres_smoke.py

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high
      - name: Run extension tests
        run: pnpm test
      - name: Type-check extension
        run: pnpm typecheck
      - name: Build clean production bundle
        run: |
          mkdir -p dist
          touch dist/stale-artifact.js
          pnpm build
          pnpm check:bundle
          test ! -e dist/stale-artifact.js
          test -f dist/manifest.json
          test -z "$(find dist -type f -name '*.map' -print -quit)"

  extension-e2e:
    name: Extension end-to-end
    needs: [backend, extension, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install locked extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: extension
        run: pnpm exec playwright install --with-deps chromium
      - name: Run extension end-to-end tests
        working-directory: extension
        run: pnpm test:e2e
      - name: Run shared workspace end-to-end test
        shell: bash
        run: |
          test_dir=$(mktemp -d)
          export SAVEMYCONTEXT_DATABASE_URL="sqlite+aiosqlite:///$test_dir/workspace.sqlite"
          export SAVEMYCONTEXT_MARKDOWN_DIR="$test_dir/vault"
          export SAVEMYCONTEXT_WORKSPACE_ENABLED=true
          export SAVEMYCONTEXT_WORKSPACE_EXTERNAL_PROCESSING=false
          cd backend
          uv run uvicorn app.main:app --host 127.0.0.1 --port 18890 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18890/health && break
            sleep 1
          done
          cd ../extension
          SMC_WORKSPACE_TEST_URL=http://127.0.0.1:18890 pnpm exec playwright test e2e/workspace.spec.ts
